# For how much time mouse motion events should be stopped after clicking?
# Prevents accidental dragging various GUI elements or links, making it easier to click
# Default: 300
click_freeze_time_ms: 300

# Default: true
keyboard_sound_enabled: true

# Alter default scale of various overlays
# Default: 1.0
keyboard_scale: 1.0
desktop_view_scale: 1.0
watch_scale: 1.0

# Keyboard profile to show, built-in: keychron-v1-ansi, full-size
# Your own profiles go in ~/.config/framexr/keyboards/*.yaml
# Default: keychron-v1-ansi
keyboard_profile: keychron-v1-ansi

# Region of the keyboard, as an xkb layout like fi, de or fi(classic). Labels follow it, and keys type
# its characters by sending whatever keys produce them on your desktop layout. A profile's own region
# wins over this. Empty follows the desktop layout.
# Default: ""
keyboard_region: ""

# Enable / disable sliding windows back and forth with the scroll action
# Default: true
allow_sliding: true

# Smooth out hand tremor while holding an overlay, without slowing down deliberate moves
# Default: true
grab_smoothing: true

# Steady the laser pointers against hand tremor, while still following deliberate moves
# Default: true
pointer_smoothing: true

# Smooth screens with a low-pass filter sized to how many screen pixels land on each headset pixel,
# reducing shimmer and moire on small text
# Default: true
screen_lowpass_filter: true

# When enabled, the mouse pointer will not be moved on the screen, unless the trigger is touched
# allowing for moving both pointers off the screens to the keyboard, while keeping the cursor position
# unchanged, for when the desktop is configured to move the focus with the mouse cursor
# Default: false
focus_follows_mouse_mode: false
