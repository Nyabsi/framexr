# looking to make changes?
# drop me in ~/.config/framexr/watch.yaml
#

width: 0.115

# the main form holds freely placed elements, the toolbar lays its buttons out in a row
form:
  width: 400
  height: 160
  toolbar:
    height: 40
    position: Below

elements:
  # background panel
  - type: Panel
    rect: [0, 30, 400, 130]
    bg_color: "@background"

  - type: Button
    region: Toolbar
    width: 26
    font_size: 15
    bg_color: "@accent"
    fg_color: "@on-accent"
    text: "C"
    click_up: # destroy if exists, otherwise create
      - type: Window
        target: settings
        action: ShowUi # only triggers if not exists
      - type: Window
        target: settings
        action: Destroy # only triggers if exists since before current frame

  # Keyboard button
  - type: Button
    region: Toolbar
    width: 48
    font_size: 15
    fg_color: "@on-accent"
    bg_color: "@green"
    text: Kbd
    click_up:
      - type: Overlay
        target: "kbd"
        action: ToggleVisible
    right_up:
      - type: Overlay
        target: "kbd"
        action: ToggleImmovable
    middle_up:
      - type: Overlay
        target: "kbd"
        action: ToggleInteraction
    scroll_up:
      - type: Overlay
        target: "kbd"
        action:
          Opacity: { delta: 0.025 }
    scroll_down:
      - type: Overlay
        target: "kbd"
        action:
          Opacity: { delta: -0.025 }

  # Recenter button: bring visible overlays back in front of your current view
  - type: Button
    region: Toolbar
    width: 48
    font_size: 15
    fg_color: "@on-accent"
    bg_color: "@blue"
    text: Ctr
    click_up:
      - type: System
        action: Recenter

  # Show/hide button: hide or bring back your screens and keyboard
  - type: Button
    region: Toolbar
    width: 48
    font_size: 15
    fg_color: "@on-accent"
    bg_color: "@green"
    text: Vis
    click_up:
      - type: System
        action: ShowHide

  # bottom row, of keyboard + overlays
  - type: OverlayList
    region: Toolbar
    width: 214
    font_size: 15
    fg_color: "@text"
    bg_color: "@panel"
    layout: Horizontal
    click_up: ToggleVisible
    right_up: ToggleImmovable
    middle_up: ToggleInteraction
    scroll_up:
      Opacity: { delta: 0.025 }
    scroll_down:
      Opacity: { delta: -0.025 }

  # local clock
  - type: Label
    rect: [19, 90, 200, 50]
    font_size: 46 # Use 32 for 12-hour time
    fg_color: "@text"
    source: Clock
    format: "%H:%M" # 23:59
    #format: "%I:%M %p" # 11:59 PM

  # local date
  - type: Label
    rect: [20, 117, 200, 20]
    font_size: 14
    fg_color: "@text"
    source: Clock
    format: "%x" # local date representation

  # local day-of-week
  - type: Label
    rect: [20, 137, 200, 50]
    font_size: 14
    fg_color: "@text"
    source: Clock
    format: "%A" # Tuesday
    #format: "%a" # Tue

  # alt clock 1
  - type: Label
    rect: [210, 90, 150, 50]
    font_size: 24 # Use 18 for 12-hour time
    fg_color: "@teal"
    source: Clock
    timezone: 0
    city_size: 14 # city name above the time
    format: "%H:%M" # 23:59
    #format: "%I:%M %p" # 11:59 PM

  # alt clock 2
  - type: Label
    rect: [210, 150, 150, 50]
    font_size: 24 # Use 18 for 12-hour time
    fg_color: "@lavender"
    source: Clock
    timezone: 1
    city_size: 14
    format: "%H:%M" # 23:59
    #format: "%I:%M %p" # 11:59 PM

  # batteries
  - type: BatteryList
    rect: [0, 5, 400, 30]
    font_size: 16
    fg_color: "@teal"
    fg_color_low: "#B06060"
    fg_color_charging: "#6080A0"
    num_devices: 9
    layout: Horizontal
    low_threshold: 33

  # volume buttons
  - type: Button
    rect: [315, 52, 70, 32]
    font_size: 13
    fg_color: "@text"
    bg_color: "@muted"
    text: "Vol +"
    click_down:
      - type: Exec
        command: ["pactl", "set-sink-volume", "@DEFAULT_SINK@", "+5%"]
  - type: Button
    rect: [315, 116, 70, 32]
    font_size: 13
    fg_color: "@text"
    bg_color: "@muted"
    text: "Vol -"
    click_down:
      - type: Exec
        command: ["pactl", "set-sink-volume", "@DEFAULT_SINK@", "-5%"]
