# looking to make changes?
# edit it in the headset with the watch's Edit button, or drop a copy in ~/.config/framexr/keyboards/
# a file with the same name replaces this profile, any other name adds a new one

# The keyboard is a grid of 1-unit rows and quarter-unit columns.
# Every key sits at [x, row] and is `width` units wide (default 1); keys may not overlap.
# What a key does:
# - key: <VirtualKey>      types it, modifiers are single use and Caps Lock latches
# - action: Profile        switches to the next keyboard profile
# - action: Ime            toggles native script and Latin
# - press / release: [..]  runs actions, like a Shortcut or an Exec command
# Optional per key: label: [lower, upper], shifted_label, style: { bg_color, fg_color, corner_radius }
# Labels follow the keyboard region unless the key sets its own.

name: "jis-full-size"
columns: 23
rows: 6
# When using the purple pointer: None, Shift (same as orange), Ctrl, Alt, Super or Meta (AltGr) is held for the key
alt_modifier: None

# Native script legends: None, Hangul, Kana or Cangjie
ime: Kana

# Region of this keyboard, as an xkb layout like fi, de or fi(classic).
# Leave it out to follow keyboard_region from the config, or the desktop layout.
region: jp

# Locales this keyboard is the default for, like ja or zh_TW
# locales: [fi, sv_FI]

