name: Build

on:
  pull_request:
  push:
    branches: [ "main", "staging" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            options: ""
          - name: wayland-openvr
            options: "-Dx11=disabled -Dopenxr=disabled -Dosc=disabled"
          - name: wayland-openxr
            options: "-Dx11=disabled -Dopenvr=disabled -Dosc=disabled"
          - name: wayland-openxr-openvr
            options: "-Dx11=disabled -Dosc=disabled"
          - name: x11-openvr
            options: "-Dwayland=disabled -Dopenxr=disabled -Dosc=disabled"
          - name: x11-openxr
            options: "-Dwayland=disabled -Dopenvr=disabled -Dosc=disabled"
    name: ${{ matrix.name }}
    steps:
    - name: Prepare Environment
      run: dnf install -y git gcc-c++ meson ninja-build glslang clang-tools-extra pkgconf-pkg-config vulkan-loader-devel wayland-devel wayland-protocols-devel libxkbcommon-devel libxkbcommon-x11-devel libxcb-devel dbus-devel freetype-devel fontconfig-devel pipewire-devel openxr-devel mesa-libgbm-devel libdrm-devel mesa-libEGL-devel mesa-libGLES-devel libX11-devel libXext-devel libXrandr-devel
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure
      run: meson setup build ${{ matrix.options }}
    - name: Build
      run: ninja -C build
    - name: Run tests and format check
      run: meson test -C build --print-errorlogs --no-suite integration
    - name: Run clang-tidy
      if: matrix.name == 'default'
      run: run-clang-tidy -p build -quiet -j "$(nproc)" "^$PWD/(src|tests)/"

  windows:
    runs-on: ubuntu-latest
    container: fedora:latest
    name: windows
    steps:
    - name: Prepare Environment
      run: dnf install -y git meson ninja-build glslang clang-tools-extra mingw64-gcc-c++ mingw64-filesystem mingw64-vulkan-headers mingw64-vulkan-loader mingw64-freetype mingw64-winpthreads-static
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure
      run: meson setup build --buildtype=release --cross-file /usr/share/mingw/toolchain-mingw64.meson --cross-file cross/windows.ini
    - name: Build
      run: ninja -C build
    - name: Run clang-tidy
      run: run-clang-tidy -p build -quiet -j "$(nproc)" "^$PWD/src/.*/win32/"
    - name: Package
      run: |
        sysroot=/usr/x86_64-w64-mingw32/sys-root/mingw/bin
        mkdir -p dist
        cp build/src/framexr.exe dist/
        todo=dist/framexr.exe
        while [ -n "$todo" ]; do
          next=""
          for file in $todo; do
            for dll in $(x86_64-w64-mingw32-objdump -p "$file" | sed -n 's/^\s*DLL Name: //p'); do
              if [ "$dll" != vulkan-1.dll ] && [ -f "$sysroot/$dll" ] && [ ! -f "dist/$dll" ]; then
                cp "$sysroot/$dll" dist/
                next="$next dist/$dll"
              fi
            done
          done
          todo=$next
        done
        x86_64-w64-mingw32-strip dist/framexr.exe
        ls -l dist
    - uses: actions/upload-artifact@v4
      with:
        name: framexr-windows
        path: dist/
